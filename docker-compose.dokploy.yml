services:
  relay:
    build:
      context: ./relay
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
    environment:
      - HTTP_PORT=8080
      - KLIPY_API_KEY=${KLIPY_API_KEY}
      - NODE_ENV=production
      - DOMAIN=${DOMAIN}
      # Set TURN_SECRET (matching coturn's --static-auth-secret) to serve
      # short-lived TURN credentials. Unset = /turn-credentials returns 204 and
      # clients fall back to the bundled static creds. See README.
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_URLS=${TURN_URLS:-}
    volumes:
      - relay_data:/app/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.relay-http.rule=Host(`relay.${DOMAIN}`)
      - traefik.http.routers.relay-http.entrypoints=web
      - traefik.http.routers.relay-http.middlewares=relay-redirect
      - traefik.http.routers.relay-https.rule=Host(`relay.${DOMAIN}`)
      - traefik.http.routers.relay-https.entrypoints=websecure
      - traefik.http.routers.relay-https.tls=true
      - traefik.http.routers.relay-https.tls.certresolver=letsencrypt
      - traefik.http.services.relay-service.loadbalancer.server.port=8080
      - traefik.http.routers.relay-https.service=relay-service
      - traefik.http.routers.relay-http.service=relay-service
      - traefik.http.middlewares.relay-redirect.redirectscheme.scheme=https
      - traefik.http.routers.og.rule=Host(`relay.${DOMAIN}`) && PathPrefix(`/og`)
      - traefik.http.routers.og.entrypoints=websecure
      - traefik.http.routers.og.tls=true
      - traefik.http.routers.og.tls.certresolver=letsencrypt
      - traefik.http.routers.og.service=relay-api-service
      - traefik.http.services.relay-api-service.loadbalancer.server.port=8081
      - traefik.http.routers.klipy.rule=Host(`relay.${DOMAIN}`) && PathPrefix(`/klipy`)
      - traefik.http.routers.klipy.entrypoints=websecure
      - traefik.http.routers.klipy.tls=true
      - traefik.http.routers.klipy.tls.certresolver=letsencrypt
      - traefik.http.routers.klipy.service=relay-api-service
      - traefik.http.routers.turn.rule=Host(`relay.${DOMAIN}`) && PathPrefix(`/turn-credentials`)
      - traefik.http.routers.turn.entrypoints=websecure
      - traefik.http.routers.turn.tls=true
      - traefik.http.routers.turn.tls.certresolver=letsencrypt
      - traefik.http.routers.turn.service=relay-api-service

  sfu:
    build:
      context: ./sfu
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - ${PORTS_UDP:-40000-40499:40000-40499/udp}
      - ${PORTS_TCP:-40000-40499:40000-40499/tcp}
    environment:
      NODE_ENV: production
      SFU_PORT: "3000"
      ANNOUNCED_IP: ${ANNOUNCED_IP:?ANNOUNCED_IP must be set to the server public IP}
      RTC_MIN_PORT: ${RTC_MIN:-40000}
      RTC_MAX_PORT: ${RTC_MAX:-40499}
    networks:
      - dokploy-network

  # For TLS TURN (turns: - strongly recommended for mobile-carrier users):
  # put fullchain.pem + privkey.pem for the domain in a directory, set
  #   TURN_TLS_DIR=/path/to/certs
  #   TURN_TLS_ARGS=--cert=/certs/fullchain.pem --pkey=/certs/privkey.pem
  # and uncomment the volumes line below.
  #
  # Relay port range: 51 ports. Production was returning "508 Cannot create
  # socket" on every allocation (measured, five for five) with this same
  # range, but the range was the ceiling, not the cause - the client was
  # spending roughly 20 allocations per peer connection because
  # iceCandidatePoolSize was 10 and four TURN urls were advertised. With the
  # pool size gone and the dead urls removed that is ~2 per connection, and 51
  # is comfortable for the current handful of users. Bumped to 100 for
  # headroom anyway - with network_mode: host nothing is published per port,
  # so the range size costs nothing at deploy time.
  #
  # Loopback and link-local are denied because host networking puts coturn on
  # the host's stack: without them a relay peer reaches services bound to
  # 127.0.0.1 and the cloud metadata endpoint at 169.254.169.254. That matters
  # all the more while the credentials are a shared secret that ships in the
  # client bundle.
  #
  # network_mode: host rather than published ports - docker publishes a range
  # by starting a userland proxy per port, which does not scale to a usable
  # relay range. coturn speaks raw UDP/TCP and Traefik does not route it, so
  # it has no reason to be on the overlay network.
  #
  # NOTE: 5349 must ALSO be opened in the VPS firewall. tcp/5349 times out
  # while an unused port like tcp/12345 refuses immediately, so packets are
  # being dropped upstream of the host - not a missing listener.
  #
  # Keep every argument below a real flag: this is a folded block, so a "#"
  # line here becomes a literal argument rather than a comment.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # volumes:
    #   - ${TURN_TLS_DIR}:/certs:ro
    command: >
      --log-file=stdout
      --verbose
      --realm=awful.frav.in
      --external-ip=${ANNOUNCED_IP}
      --listening-ip=0.0.0.0
      --lt-cred-mech
      --user=awful:awful
      --fingerprint
      --no-multicast-peers
      --alt-listening-port=5349
      --denied-peer-ip=100.64.0.0-100.127.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255
      --min-port=49152
      --max-port=49251
      ${TURN_TLS_ARGS:-}
    network_mode: host

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_RELAY_MULTIADDR=${VITE_RELAY_MULTIADDR}
    restart: unless-stopped
    depends_on:
      - relay
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.awful2-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.awful2-http.entrypoints=web
      - traefik.http.routers.awful2-http.middlewares=awful2-redirect
      - traefik.http.middlewares.awful2-redirect.redirectscheme.scheme=https
      - traefik.http.routers.awful2-https.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.awful2-https.entrypoints=websecure
      - traefik.http.routers.awful2-https.tls=true
      - traefik.http.routers.awful2-https.tls.certresolver=letsencrypt
      - traefik.http.services.awful2-service.loadbalancer.server.port=80
      - traefik.http.routers.awful2-https.service=awful2-service
      - traefik.http.routers.awful2-http.service=awful2-service

volumes:
  relay_data:

networks:
  dokploy-network:
    external: true
