server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression - page speed feeds Core Web Vitals / SEO
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml image/svg+xml;

    #TODO: change this to subdomain too
    # Proxy mediasoup SFU WebSocket signaling
    location /sfu {
        proxy_pass http://sfu:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Serve static assets directly
    location /og.png {
        alias /usr/share/nginx/html/og.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /og-invite.png {
        alias /usr/share/nginx/html/og-invite.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
    }

    location /manifest.webmanifest {
        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    location /apple-touch-icon-180x180.png {
        alias /usr/share/nginx/html/apple-touch-icon-180x180.png;
        expires 30d;
    }

    location /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        expires 30d;
    }

    location /pwa- {
        alias /usr/share/nginx/html/pwa-;
        expires 30d;
    }

    location /sw.js {
        alias /usr/share/nginx/html/sw.js;
        expires -1;
    }

    location /workbox- {
        alias /usr/share/nginx/html/workbox-;
        expires 30d;
    }

    # Hashed build assets never change - cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Invite links get their own preview card: scrapers never run JS, so the
    # meta tags are rewritten server-side for /r/* while the SPA bundle stays
    # identical. sub_filter runs before gzip, so compression is unaffected.
    location ~ ^/r/ {
        sub_filter_once off;
        sub_filter 'https://awful.frav.in/og.png' 'https://awful.frav.in/og-invite.png';
        sub_filter 'content="630"' 'content="635"';
        sub_filter 'Awful.chat - No need to expose your identity to have a conversation.' 'You are invited to a private room on Awful.chat';
        sub_filter 'content="https://awful.frav.in"' 'content="https://awful.frav.in$request_uri"';
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # SPA fallback - all unknown paths serve index.html.
    #
    # no-cache means "revalidate before use", not "do not store": index.html
    # names the hashed bundle, so a browser holding an old copy keeps loading
    # the old build. It had no cache headers at all, which makes it
    # heuristically cacheable, and the result was a deploy that only took
    # effect once someone happened to hard-reload.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
