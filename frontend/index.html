<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Awful.chat</title>
    <link rel="canonical" href="https://awful.frav.in" />
    <meta
      name="description"
      content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="index, follow" />

    <!-- Installed-app behaviour. iOS still reads the apple-prefixed pair, and
         black-translucent lets the app paint under the status bar (index.html
         already sets viewport-fit=cover for the safe-area insets). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Awful.chat" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Awful.chat - No need to expose your identity to have a conversation."
    />
    <meta
      property="og:description"
      content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://awful.frav.in" />
    <!-- OG scrapers require absolute image URLs -->
    <meta property="og:image" content="https://awful.frav.in/og-invite.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="635" />
    <meta
      property="og:image:alt"
      content="Awful.chat - end-to-end encrypted P2P chat"
    />
    <meta property="og:site_name" content="Awful.chat" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Awful.chat - No need to expose your identity to have a conversation."
    />
    <meta
      name="twitter:description"
      content="End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required."
    />
    <meta name="twitter:image" content="https://awful.frav.in/og-invite.png" />
    <meta
      name="twitter:image:alt"
      content="Awful.chat - end-to-end encrypted P2P chat"
    />

    <link rel="icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
      sizes="180x180"
    />
    <link rel="mask-icon" href="/logo.svg" color="#09090b" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Awful.chat",
        "url": "https://awful.frav.in",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Web",
        "description": "End-to-end encrypted P2P chat with voice, video, and file sharing. Open source. No accounts, no phone numbers, no personal data required.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "browserRequirements": "Requires a modern browser with WebRTC support"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
